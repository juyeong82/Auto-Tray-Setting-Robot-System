sensors:
  - default_sensor
default_sensor:
  filtered_cloud_topic: /camera/filtered_points
  max_range: 3.0
  max_update_rate: ""
  padding_offset: 0.01
  padding_scale: 1.0
  point_cloud_topic: /camera/depth/color/points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater