# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # update_rate: 100  # Hz
    # 컨트롤러 업데이트 주기가 Gazebo 시뮬레이션과 일치화
    update_rate: 1000  # Hz

    manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

manipulator_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
gripper_controller:
  ros__parameters:
    joints:
      - rg2_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# 방송할 관절 명단을 직접 지정하여 유령 관절(_mimic) 제외
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - rg2_finger_joint1